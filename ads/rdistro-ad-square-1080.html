<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RDistro Square Ad (1080x1080)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #efefef;
      font-family: Arial, Helvetica, sans-serif;
    }

    .ad {
      width: 1080px;
      height: 1080px;
      background: #ffffff;
      color: #111111;
      border: 1px solid #dcdcdc;
      position: relative;
      overflow: hidden;
      padding: 88px;
    }

    .mark {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .bars { display: flex; align-items: flex-end; gap: 6px; height: 48px; }
    .bar { width: 8px; background: #111111; border-radius: 4px; }
    .b1 { height: 18px; } .b2 { height: 32px; } .b3 { height: 48px; } .b4 { height: 28px; } .b5 { height: 40px; }

    .brand {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .subbrand {
      color: #666666;
      font-size: 14px;
      letter-spacing: 3px;
      margin-bottom: 44px;
    }

    .headline {
      font-size: 88px;
      line-height: 0.95;
      font-weight: 800;
      margin-bottom: 26px;
      letter-spacing: -2px;
    }

    .copy {
      font-size: 34px;
      color: #333333;
      max-width: 820px;
      line-height: 1.3;
      margin-bottom: 56px;
    }

    .points {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 62px;
    }

    .pill {
      border: 1px solid #222222;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 22px;
      font-weight: 700;
    }

    .cta {
      display: inline-block;
      background: #111111;
      color: #ffffff;
      font-size: 40px;
      font-weight: 800;
      padding: 24px 42px;
      border-radius: 12px;
      text-decoration: none;
      margin-bottom: 24px;
    }

    .url {
      font-size: 28px;
      color: #444444;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .accent {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 220px;
      height: 220px;
      border-left: 2px solid #111111;
      border-top: 2px solid #111111;
      background: linear-gradient(135deg, transparent 0%, transparent 50%, #f7f7f7 50%, #f7f7f7 100%);
    }
  </style>
</head>
<body>
  <main class="ad">
    <div class="mark">
      <div class="bars">
        <span class="bar b1"></span>
        <span class="bar b2"></span>
        <span class="bar b3"></span>
        <span class="bar b4"></span>
        <span class="bar b5"></span>
      </div>
      <div class="brand">RDISTRO</div>
    </div>
    <div class="subbrand">MUSIC DISTRIBUTION</div>

    <h1 class="headline">Release Your Music Worldwide</h1>
    <p class="copy">Get your songs on 150+ platforms with fast delivery for artists and labels.</p>

    <section class="points">
      <span class="pill">150+ Platforms</span>
      <span class="pill">Fast Release</span>
      <span class="pill">Artist & Label Plans</span>
    </section>

    <a class="cta" href="#">Start Now</a>
    <div class="url">RDISTRO.NET</div>

    <div class="accent"></div>
  </main>
</body>
</html>
